<!DOCTYPE html>
<html lang="fa">

<head>

<meta charset="UTF-8">

<title>
ویرایش پروفایل
</title>

<link rel="stylesheet"
href="style.css">

</head>

<body dir="rtl">

<div class="edit-page">

<form id="editProfileForm"
class="edit-form">

<h2>
ویرایش پروفایل
</h2>

<input id="name"
placeholder="نام">

<input id="lastname"
placeholder="نام خانوادگی">

<input id="cityInput"
placeholder="شهر">

<input id="emailInput"
placeholder="ایمیل">

<input id="phoneInput"
placeholder="شماره">

<button type="submit"
class="save-btn">

ذخیره تغییرات

</button>

</form>

</div>

<script src="edit-profile.js"></script>

</body>
</html>
