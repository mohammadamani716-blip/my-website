<!DOCTYPE html>
<html lang="fa">

<head>

<meta charset="UTF-8">

<title>ویرایش آگهی</title>

<link rel="stylesheet" href="style.css">

</head>

<body dir="rtl">

<div class="edit-page">

<form id="editForm"
class="edit-form">

<h2>
ویرایش آگهی
</h2>

<p class="subtitle">
اطلاعات ملک خود را بروزرسانی کنید
</p>

<div class="form-group">

<label>
عنوان آگهی
</label>

<input id="title"
placeholder="مثلاً آپارتمان لوکس">

</div>


<div class="form-group">

<label>
شهر / محله
</label>

<input id="city"
placeholder="تهران - سعادت آباد">

</div>


<div class="double-input">

<div class="form-group">

<label>
قیمت
</label>

<input id="price"
type="number">

</div>

<div class="form-group">

<label>
متراژ
</label>

<input id="area"
type="number">

</div>

</div>



<div class="form-group">

<label>
تعداد اتاق
</label>

<input id="rooms"
type="number">

</div>


<div class="form-group">

<label>
توضیحات
</label>

<textarea id="desc"
placeholder="توضیحات کامل ملک">
</textarea>

</div>


<button type="submit"
class="save-btn">

ذخیره تغییرات

</button>

</form>

</div>

<script src="edit-property.js"></script>

</body>
</html>
